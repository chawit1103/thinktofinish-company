# Company policy for native Hermes Kanban graph recovery.
review_request_changes:
  required_comment: ttf_review
  transition: create_remediation_and_rereview_then_rewire_downstream_children
retained_blocked_allowed_only_for:
  - retained_human_gate
  - secrets_or_real_pii
  - production_or_destructive_operation
  - unresolved_critical_security_issue
  - unavailable_required_capability_after_safe_alternatives
never_block_for:
  - dependency_waiting
  - independent_review_waiting
  - review_required_handoff
  - review_request_changes
  - ordinary_technical_decision
  - routine_tool_approval_timeout
actions:
  dependency_waiting: autonomous
  independent_review_waiting: autonomous
  review_required_handoff: autonomous
  review_request_changes: autonomous
  ordinary_technical_decision: autonomous
  routine_tool_approval_timeout: autonomous
