[project]
name = "thinktofinish-company"
version = "0.2.0"
description = "ThinkToFinish AI Company Governance Core for OMH + Hermes Agent"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["thinktofinish_company"]
