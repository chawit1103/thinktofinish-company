name: CI
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv python install 3.12
      - run: uv sync --extra dev
      - run: uv run pytest
      - run: uv run python scripts/mcp-smoke.py
      - run: bash -n scripts/*.sh
      - run: python -m json.tool plugin.json >/dev/null
      - run: python -m json.tool mcp.json >/dev/null
