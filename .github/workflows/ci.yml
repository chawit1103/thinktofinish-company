name: CI
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv python install 3.12
      - run: uv sync --extra dev
      - run: uv run python -m pytest
      - run: uv run python scripts/runtime-boundary-check.py
      # Legacy compatibility code remains tested while old boards are migrated.
      - run: uv run make PYTHON=python transition-check
      - run: uv run python scripts/mcp-smoke.py
      - run: for script in scripts/*.sh; do bash -n "$script"; done
      - run: python -m json.tool plugin.json >/dev/null
      - run: python -m json.tool mcp.json >/dev/null
      - run: python -m json.tool policies/runtime-boundary.json >/dev/null
